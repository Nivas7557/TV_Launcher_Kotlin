name: Android Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get IST Time and Date
        id: timestamp
        run: |
          STAMP=$(TZ='Asia/Kolkata' date +'%H-%M_%d-%m')
          echo "dt=$STAMP" >> $GITHUB_OUTPUT

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK with Timestamp
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug_${{ steps.timestamp.outputs.dt }}.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nivas_Launcher_${{ steps.timestamp.outputs.dt }}
          path: app/build/outputs/apk/debug/app-debug_${{ steps.timestamp.outputs.dt }}.apk
          retention-days: 7
          if-no-files-found: error
